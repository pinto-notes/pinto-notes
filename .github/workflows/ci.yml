name: ci

# Two shapes, one workflow. Needs no secrets; forks included.
#
# A pull request gets the fast lane, once it is marked ready for review: the app's tests are built
# (Debug) and only the tests the change is likely to break run (scripts/ci/select-tests.py: a smoke
# set, the touched test files, their near relations, about 90 seconds in all). A draft runs no Mac
# job at all, and neither does a change that touches nothing of the app; the Linux jobs (secret
# scan, server, site) run either way. Whoever pushes runs scripts/prepush.sh first: it compiles
# what ships, which a pull request into dev no longer does here.
#
# A pull request into main also compiles what ships (the Mac download and the iPhone app, Release).
#
# A push to dev or main (a merge) gets everything: the whole unit suite, the timing tests, the
# suites that wait on real time, both Release compiles. That run also fills the caches the pull
# requests read. When it fails it opens an issue that names the merge, so a red run is never just
# a badge.
on:
  push:
    branches: [main, dev]
  pull_request:
    # ready_for_review: the Mac work starts when a draft is marked ready. A push to a pull request
    # that is already ready runs it again.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A newer push to a pull request replaces the run before it. After a merge nothing is cancelled:
# one run at a time per branch, and while it runs only the newest merge waits behind it, so the
# full suite always finishes on something and a burst of merges is tested together (the issue a
# red run opens lists every merge since the last green one).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What the change touches, so a job that cannot be affected by it is skipped. A skipped job
  # counts as passed for a required check; a job that never started would not, so the jobs are
  # always there and decide by this. A push to main runs everything. Only the app's job is
  # decided here (it is the long one, on the scarce runners): the server's and the site's tests
  # read each other's files and the app's, and take a few minutes on plentiful runners.
  #
  # The app's job is skipped only when every changed file is in a place the app is not built or
  # tested from. supabase/ is not such a place: the app's tests read server files (the E2EE and
  # collaboration vectors, a migration, the MCP server's sources), and web/content/changelog.json
  # ships inside the app. When in doubt a path is left out of the list, and the job runs.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.paths.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: paths
        env:
          PULL: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PULL" ]; then
            echo "Not a pull request: every job runs."
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The checkout is the pull request merged into its base as the base is now: against that
          # commit's first parent, that is the change. (The base the pull request was opened on is
          # older, and against it other people's merges would count as this change.)
          git diff --name-only HEAD^1 HEAD > changed.txt
          echo "$(wc -l < changed.txt | tr -d ' ') files changed"
          app=false
          if grep -qvE '^(web/|docs/|strategy/|brand/|plugins/|cli/|scripts/|[^/]+\.md$|LICENSE$|\.github/)' changed.txt \
             || grep -qxE 'web/content/changelog\.json|\.github/workflows/ci\.yml' changed.txt; then app=true; fi
          echo "app tests: $app"
          echo "app=$app" >> "$GITHUB_OUTPUT"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --no-banner --redact -v -c .gitleaks.toml

  # A pull request's Mac work, once it is ready for review: one job. A draft skips it.
  lane-tests:
    name: The tests for this change (macOS)
    needs: changes
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && needs.changes.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      XC_FLAGS: ENABLE_TESTABILITY=YES ENABLE_HARDENED_RUNTIME=NO CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH=${{ github.workspace }}/build/cas
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select the newest Xcode
        id: xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] && sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//')" >> "$GITHUB_OUTPUT"
      # The Swift packages and the compiler's own cache of what it has built (by content, so a
      # file that did not change is not compiled again), kept between runs of this job.
      - name: Packages and compiled output from earlier runs
        uses: actions/cache/restore@v4
        with:
          path: |
            build/DD/SourcePackages
            build/cas
          key: app-unit-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Pane.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            app-unit-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Pane.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            app-unit-${{ steps.xcode.outputs.version }}-
      - name: Generate the project
        run: brew install xcodegen && xcodegen generate
      - name: Build the app and its tests
        run: |
          set -o pipefail
          mkdir -p build
          du -sh build/cas build/DD/SourcePackages 2>/dev/null || echo "nothing from earlier runs"
          xcodebuild build-for-testing -project Pane.xcodeproj -scheme Pane -destination 'platform=macOS' \
            -derivedDataPath build/ci -clonedSourcePackagesDirPath build/DD/SourcePackages $XC_FLAGS \
            | tee build/ci-build.log | grep -E "error:|\*\* TEST BUILD" || true
          grep -q "\*\* TEST BUILD SUCCEEDED \*\*" build/ci-build.log
      - name: The tests this change is likely to break
        env:
          TEST_RUNNER_PANE_PERF_SLACK: "4"
          TEST_RUNNER_PANE_SNAPSHOTS: "1"
        run: |
          set -o pipefail
          # Against the first parent of the merged checkout: this pull request's change and no one else's.
          git diff --name-only HEAD^1 HEAD > changed.txt
          python3 scripts/ci/select-tests.py changed.txt > only.txt
          xcodebuild test-without-building -project Pane.xcodeproj -scheme Pane -destination 'platform=macOS' \
            $(tr '\n' ' ' < only.txt) -derivedDataPath build/ci -resultBundlePath build/ci-tests.xcresult $XC_FLAGS \
            | tee build/ci-test.log | grep -E "✔ Test run|✘|error:|PERF|\*\* TEST" || true
          grep -qE "\*\* TEST (EXECUTE )?SUCCEEDED \*\*" build/ci-test.log
          # A name that matches no test is not an error to xcodebuild, so count: every single test
          # that was asked for has to have run.
          asked=$(grep -c '()$' only.txt || true)
          ran=$(grep -oE "Test run with [0-9]+ test" build/ci-test.log | grep -oE "[0-9]+" | tail -1)
          if [ "${ran:-0}" -lt "$asked" ]; then
            echo "error: $asked single tests were asked for and ${ran:-0} ran; a line in scripts/ci/smoke-tests.txt matches no test"
            exit 1
          fi
      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-results
          path: |
            build/ci-build.log
            build/ci-test.log
            build/ci-tests.xcresult
            ~/Library/Logs/DiagnosticReports/Pane*
          retention-days: 7

  # After a merge: everything, as three jobs side by side (it was one after the other, 24
  # minutes): every unit and interaction test, the timing tests in a process and on a runner of
  # their own, and the iPhone simulator build.
  app-unit:
    name: After merge, every unit test (macOS)
    needs: changes
    if: github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # The suites that time things (PaneTests/Perf) run in the timing job.
      PERF_SKIP: -skip-testing:PaneTests/EditorPerfTests -skip-testing:PaneTests/AppPerfTests -skip-testing:PaneTests/ScanPerfTests -skip-testing:PaneTests/WindowUpdateTests -skip-testing:PaneTests/ListPiecesPerfTests
      XC_FLAGS: ENABLE_TESTABILITY=YES ENABLE_HARDENED_RUNTIME=NO CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH=${{ github.workspace }}/build/cas
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        id: xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] && sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//')" >> "$GITHUB_OUTPUT"
      # The Swift packages and the compiler's own cache of what it has built (by content, so a
      # file that did not change is not compiled again), kept between runs of this job.
      - name: Packages and compiled output from earlier runs
        uses: actions/cache@v4
        with:
          path: |
            build/DD/SourcePackages
            build/cas
          key: app-unit-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Pane.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            app-unit-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Pane.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            app-unit-${{ steps.xcode.outputs.version }}-
      - name: Generate the project
        run: brew install xcodegen && xcodegen generate
      - name: Build the app and its tests
        run: |
          set -o pipefail
          mkdir -p build
          du -sh build/cas build/DD/SourcePackages 2>/dev/null || echo "nothing from earlier runs"
          xcodebuild build-for-testing -project Pane.xcodeproj -scheme Pane -destination 'platform=macOS' \
            -derivedDataPath build/ci -clonedSourcePackagesDirPath build/DD/SourcePackages $XC_FLAGS \
            | tee build/ci-build.log | grep -E "error:|\*\* TEST BUILD" || true
          grep -q "\*\* TEST BUILD SUCCEEDED \*\*" build/ci-build.log
      - name: Unit and interaction tests
        env:
          # Runners are several times slower than a developer's Mac; see PaneTests/Perf/PerfBudget.swift.
          TEST_RUNNER_PANE_PERF_SLACK: "4"
          # Snapshot tests that draw windows (ImageViewerSnapshots) run here only, never on a developer's Mac.
          TEST_RUNNER_PANE_SNAPSHOTS: "1"
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Pane.xcodeproj -scheme Pane -destination 'platform=macOS' \
            -only-testing:PaneTests $PERF_SKIP -derivedDataPath build/ci -resultBundlePath build/ci-tests.xcresult $XC_FLAGS \
            | tee build/ci-test.log | grep -E "✔ Test run|✘|error:|PERF|\*\* TEST" || true
          # test-without-building says TEST EXECUTE SUCCEEDED.
          grep -qE "\*\* TEST (EXECUTE )?SUCCEEDED \*\*" build/ci-test.log
      # A failure keeps the whole log and the result bundle: a test host that hangs or crashes
      # records no issue in the filtered output above, only its name under "Failing tests". The
      # crash reports say where it died.
      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-results
          path: |
            build/ci-build.log
            build/ci-test.log
            build/ci-tests.xcresult
            ~/Library/Logs/DiagnosticReports/Pane*
          retention-days: 7
      # Pictures the snapshot tests attach (FileViewerSnapshots and others): kept after every run, so a
      # UI change can be looked at without running anything on a developer's screen.
      - name: Export the snapshots
        if: always()
        run: |
          mkdir -p build/snapshots
          [ -d build/ci-tests.xcresult ] && xcrun xcresulttool export attachments --path build/ci-tests.xcresult --output-path build/snapshots || true
      - name: Keep the snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: build/snapshots
          if-no-files-found: ignore
          retention-days: 7

  app-timing:
    name: After merge, timing tests (macOS)
    needs: changes
    if: github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      PERF_ONLY: -only-testing:PaneTests/EditorPerfTests -only-testing:PaneTests/AppPerfTests -only-testing:PaneTests/ScanPerfTests -only-testing:PaneTests/WindowUpdateTests -only-testing:PaneTests/ListPiecesPerfTests
      XC_FLAGS: ENABLE_TESTABILITY=YES ENABLE_HARDENED_RUNTIME=NO CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH=${{ github.workspace }}/build/cas
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        id: xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] && sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//')" >> "$GITHUB_OUTPUT"
      # The Swift packages and the compiler's own cache of what it has built (by content, so a
      # file that did not change is not compiled again), kept between runs of this job.
      - name: Packages and compiled output from earlier runs
        uses: actions/cache@v4
        with:
          path: |
            build/DD/SourcePackages
            build/cas
          key: app-timing-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Pane.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            app-timing-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Pane.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            app-timing-${{ steps.xcode.outputs.version }}-
      - name: Generate the project
        run: brew install xcodegen && xcodegen generate
      - name: Build the app and its tests
        run: |
          set -o pipefail
          mkdir -p build
          du -sh build/cas build/DD/SourcePackages 2>/dev/null || echo "nothing from earlier runs"
          xcodebuild build-for-testing -project Pane.xcodeproj -scheme Pane -destination 'platform=macOS' \
            -derivedDataPath build/ci -clonedSourcePackagesDirPath build/DD/SourcePackages $XC_FLAGS \
            | tee build/ci-build.log | grep -E "error:|\*\* TEST BUILD" || true
          grep -q "\*\* TEST BUILD SUCCEEDED \*\*" build/ci-build.log
      - name: Timing tests, on their own
        env:
          # Runners are several times slower than a developer's Mac; see PaneTests/Perf/PerfBudget.swift.
          TEST_RUNNER_PANE_PERF_SLACK: "4"
        run: |
          set -o pipefail
          # A process and a runner of their own, one test at a time, so nothing else slows what they measure.
          xcodebuild test-without-building -project Pane.xcodeproj -scheme Pane -destination 'platform=macOS' \
            $PERF_ONLY -parallel-testing-enabled NO -derivedDataPath build/ci -resultBundlePath build/ci-perf.xcresult $XC_FLAGS \
            | tee build/ci-perf.log | grep -E "✔ Test run|✘|error:|PERF|\*\* TEST" || true
          grep -qE "\*\* TEST (EXECUTE )?SUCCEEDED \*\*" build/ci-perf.log
      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-timing-results
          path: |
            build/ci-build.log
            build/ci-perf.log
            build/ci-perf.xcresult
            ~/Library/Logs/DiagnosticReports/Pane*
          retention-days: 7

  app-ios:
    name: After merge, iPhone simulator build
    needs: changes
    if: github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      XC_FLAGS: CODE_SIGNING_ALLOWED=NO COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH=${{ github.workspace }}/build/cas
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        id: xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] && sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//')" >> "$GITHUB_OUTPUT"
      # The Swift packages and the compiler's own cache of what it has built (by content, so a
      # file that did not change is not compiled again), kept between runs of this job.
      - name: Packages and compiled output from earlier runs
        uses: actions/cache@v4
        with:
          path: |
            build/DD/SourcePackages
            build/cas
          key: app-ios-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Pane.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            app-ios-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Pane.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            app-ios-${{ steps.xcode.outputs.version }}-
      - name: Generate the project
        run: brew install xcodegen && xcodegen generate
      - name: iOS simulator build
        run: |
          set -o pipefail
          mkdir -p build
          du -sh build/cas build/DD/SourcePackages 2>/dev/null || echo "nothing from earlier runs"
          xcodebuild build -project Pane.xcodeproj -scheme Pane -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ci-ios -clonedSourcePackagesDirPath build/DD/SourcePackages $XC_FLAGS | grep -E "error:|\*\* BUILD" || true
          test -d build/ci-ios/Build/Products/Debug-iphonesimulator/Pane.app

  # What ships, compiled in Release: after every merge, and on a pull request into main. A pull
  # request into dev does not run these two; scripts/prepush.sh compiles the same before the push.
  release-mac:
    name: Mac download compiles (Release)
    needs: changes
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.base_ref == 'main' && !github.event.pull_request.draft && needs.changes.outputs.app == 'true')
    runs-on: macos-26
    timeout-minutes: 30
    env:
      XC_FLAGS: CODE_SIGNING_ALLOWED=NO COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH=${{ github.workspace }}/build/cas
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        id: xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] && sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//')" >> "$GITHUB_OUTPUT"
      # The Swift packages and the compiler's own cache of what it has built (by content, so a
      # file that did not change is not compiled again), kept between runs of this job.
      - name: Packages and compiled output from earlier runs
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/DD/SourcePackages
            build/cas
          key: app-relmac-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Pane.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            app-relmac-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Pane.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            app-relmac-${{ steps.xcode.outputs.version }}-
      - name: Generate the project
        run: brew install xcodegen && xcodegen generate
      - name: PaneDirect, Release, signing off
        run: |
          set -o pipefail
          mkdir -p build
          du -sh build/cas build/DD/SourcePackages 2>/dev/null || echo "nothing from earlier runs"
          xcodebuild build -project Pane.xcodeproj -scheme AmberNotesDirect -configuration Release -destination 'generic/platform=macOS' -derivedDataPath build/ci-relmac \
            -clonedSourcePackagesDirPath build/DD/SourcePackages $XC_FLAGS ONLY_ACTIVE_ARCH=YES DEBUG_INFORMATION_FORMAT=dwarf | grep -E "error:|\*\* BUILD" || true
          ls -d build/ci-relmac/Build/Products/Release/*.app
      - name: Keep the packages and compiled output for the pull requests
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            build/DD/SourcePackages
            build/cas
          key: ${{ steps.cache.outputs.cache-primary-key }}

  release-ios:
    name: iPhone app compiles (Release)
    needs: changes
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.base_ref == 'main' && !github.event.pull_request.draft && needs.changes.outputs.app == 'true')
    runs-on: macos-26
    timeout-minutes: 30
    env:
      XC_FLAGS: CODE_SIGNING_ALLOWED=NO COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH=${{ github.workspace }}/build/cas
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        id: xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] && sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//')" >> "$GITHUB_OUTPUT"
      # The Swift packages and the compiler's own cache of what it has built (by content, so a
      # file that did not change is not compiled again), kept between runs of this job.
      - name: Packages and compiled output from earlier runs
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/DD/SourcePackages
            build/cas
          key: app-relios-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Pane.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            app-relios-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Pane.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            app-relios-${{ steps.xcode.outputs.version }}-
      - name: Generate the project
        run: brew install xcodegen && xcodegen generate
      - name: The iPhone app, Release, signing off
        run: |
          set -o pipefail
          mkdir -p build
          du -sh build/cas build/DD/SourcePackages 2>/dev/null || echo "nothing from earlier runs"
          xcodebuild build -project Pane.xcodeproj -scheme Pane -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/ci-relios \
            -clonedSourcePackagesDirPath build/DD/SourcePackages $XC_FLAGS ONLY_ACTIVE_ARCH=YES DEBUG_INFORMATION_FORMAT=dwarf | grep -E "error:|\*\* BUILD" || true
          ls -d build/ci-relios/Build/Products/Release-iphoneos/*.app
      - name: Keep the packages and compiled output for the pull requests
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            build/DD/SourcePackages
            build/cas
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # The required check (its name is in the branch rules: keep it). It passes when every Mac job
  # that ran passed; the ones that don't belong to this kind of run, or were skipped because the
  # pull request is a draft or touches nothing of the app, count as passed. A failed or cancelled
  # one fails it.
  app:
    name: App tests (macOS)
    needs: [changes, lane-tests, release-mac, release-ios, app-unit, app-timing, app-ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: The Mac jobs
        env:
          RESULTS: tests for this change ${{ needs.lane-tests.result }}, Mac Release ${{ needs.release-mac.result }}, iPhone Release ${{ needs.release-ios.result }}, every unit test ${{ needs.app-unit.result }}, timing ${{ needs.app-timing.result }}, simulator build ${{ needs.app-ios.result }}, what changed ${{ needs.changes.result }}
        run: |
          echo "$RESULTS"
          [ "${{ needs.changes.result }}" = success ] || exit 1
          for r in "${{ needs.lane-tests.result }}" "${{ needs.release-mac.result }}" "${{ needs.release-ios.result }}" "${{ needs.app-unit.result }}" "${{ needs.app-timing.result }}" "${{ needs.app-ios.result }}"; do
            [ "$r" = success ] || [ "$r" = skipped ] || exit 1
          done

  # A red run after a merge reaches a person: an issue that names the merges it covers.
  report:
    name: Say so when dev or main is red
    needs: [app-unit, app-timing, app-ios, release-mac, release-ios, server, web, secrets]
    # cancelled too: a job that runs out of time (a test that hangs) ends as cancelled, not failed.
    if: always() && github.event_name == 'push' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      # No issue is opened (internal findings are not tracked in GitHub issues): the run says it
      # on its own page and on every pull request it covers, and then fails.
      - name: Say it on the pull requests this run covers
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          BRANCH: ${{ github.ref_name }}
        run: |
          failed=$(gh api "repos/$REPO/actions/runs/$RUN/jobs?per_page=100" -q '[.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") | .name] | join(", ")')
          # Every merge this run covers: the commits since the last green run on this branch (a burst
          # of merges is tested together, and a run that waited may have been replaced by a newer one).
          green=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=$BRANCH&event=push&status=success&per_page=1" -q '.workflow_runs[0].head_sha // empty' 2>/dev/null || true)
          merges=$(gh api "repos/$REPO/compare/${green:-$BEFORE}...$SHA" -q '.commits[] | select(.commit.message | test("^Merge pull request #")) | "- " + (.commit.message | split("\n")[0]) + " (" + .sha[0:8] + ")"' 2>/dev/null || true)
          [ -n "$merges" ] || merges="- $(gh api "repos/$REPO/commits/$SHA" -q '.commit.message | split("\n")[0]') (${SHA:0:8})"
          {
            echo "The full run after a merge into \`$BRANCH\` failed at ${SHA:0:8}: **$failed**."
            echo
            echo "Run: https://github.com/$REPO/actions/runs/$RUN"
            echo
            echo "Merges this run covers (one of them broke it, or it is a flaky test: re-run the failed job once to tell):"
            echo "$merges"
            echo
            echo "Pull requests run a selection of the tests; everything runs here. Until this is green, \`$BRANCH\` is not a candidate for a release."
          } > body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"
          for pr in $(echo "$merges" | grep -oE 'Merge pull request #[0-9]+' | grep -oE '[0-9]+' | sort -un); do
            gh pr comment "$pr" -R "$REPO" --body-file body.md || echo "::warning::could not comment on #$pr"
          done
          echo "::error title=$BRANCH is red after ${SHA:0:8}::$failed. Merges covered: $(echo "$merges" | grep -oE '#[0-9]+' | sort -u | tr '\n' ' ')"
          exit 1

  server:
    name: Server (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck the Edge Functions
        run: for f in supabase/functions/*/index.ts scripts/e2ee-tool.ts scripts/e2ee-wipe-storage.ts; do deno check "$f"; done
      # Side by side, except the files that write the environment: see the script.
      - name: Unit tests
        run: >-
          scripts/ci/deno-tests.sh
          supabase/functions/_shared/e2ee.test.ts supabase/functions/_shared/log.test.ts supabase/functions/_shared/apns.test.ts supabase/functions/_shared/db.test.ts supabase/functions/_shared/client.test.ts supabase/functions/_shared/region.test.ts
          supabase/functions/mcp/notes.test.ts supabase/functions/mcp/needs_database.test.ts supabase/functions/mcp/annotations.test.ts supabase/functions/mcp/card.test.ts supabase/functions/mcp/instructions.test.ts
          supabase/functions/mcp/oauth.pglite.test.ts supabase/functions/mcp/locked.pglite.test.ts supabase/functions/mcp/e2ee.pglite.test.ts
          supabase/functions/mcp/canary.pglite.test.ts supabase/functions/mcp/sealed_tools.pglite.test.ts supabase/functions/mcp/device_add.pglite.test.ts
          supabase/functions/mcp/tips.pglite.test.ts supabase/functions/mcp/folder_files.pglite.test.ts supabase/functions/mcp/share_ask.pglite.test.ts supabase/functions/mcp/open_source_ask.pglite.test.ts supabase/functions/mcp/download_counts.pglite.test.ts supabase/functions/mcp/collab.pglite.test.ts
          supabase/functions/share-files/logic.test.ts scripts/e2ee-tool.test.ts
          supabase/functions/account/account.pglite.test.ts supabase/functions/_shared/hash.test.ts
          scripts/auth-emails.test.ts scripts/ops/daily-digest.test.ts supabase/functions/mcp/tool_errors.test.ts supabase/functions/lifecycle/logic.test.ts supabase/functions/lifecycle/emails.test.ts supabase/functions/lifecycle/assets.test.ts supabase/functions/lifecycle/lifecycle.pglite.test.ts
          supabase/functions/mcp/rename.pglite.test.ts

  web:
    name: Share site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
