name: ci

# Small on purpose (2026-10-12), and lean (2026-10-13): each commit is tested once, where it lands.
#
# A pull request into dev, once it is marked ready for review: the server's tests, the secret scan,
# and one Mac job that builds the app's tests and runs the ones the change is likely to break
# (scripts/ci/select-tests.py: a smoke set, the touched test files, their near relations, about
# 8 minutes). A draft runs no Mac job, and neither does a change that touches nothing of the app
# (the job then stops after its first step). Whoever pushes runs scripts/prepush.sh first: it
# compiles what ships (the Mac download and the iPhone app, Release), which no job here does;
# release-mac.sh compiles it again for a release.
#
# A push to dev (a merge): the same three, the Mac job selecting by what the push changed. Any of
# them failing makes the run red.
#
# A release, a pull request from dev into main: the server's tests and the share site only. The
# commit already ran on dev, so the Mac job stops after its first step (it is a required check of
# main, so it still reports) and there is no secret scan. A push to main runs nothing: main only
# ever gets the dev commit that already ran.
#
# Every app test (all unit and interaction tests, then the timing and render-count tests) runs once
# a night on dev, and by hand (Run workflow): one Mac job of about 25 minutes that reports what
# failed and the timing numbers in its summary, shows red when a test failed, and never blocks
# anything. It also fills the caches the other Mac jobs read.
on:
  push:
    branches: [dev]
  pull_request:
    # ready_for_review: the Mac work starts when a draft is marked ready. A push to a pull request
    # that is already ready runs it again.
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # 02:00 UTC, every night.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces the run before it. After a merge nothing is cancelled:
# one run at a time per branch, and while it runs only the newest merge waits behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secret scan
    # Not for a release (dev into main: the commit was scanned on dev), not in the nightly run.
    if: (github.event_name == 'push' || github.event_name == 'pull_request') && !(github.event_name == 'pull_request' && github.head_ref == 'dev' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --no-banner --redact -v -c .gitleaks.toml

  lane-tests:
    # The name is a required check of the main branch's ruleset.
    name: App tests (macOS)
    if: (github.event_name == 'pull_request' && !github.event.pull_request.draft) || github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      XC_FLAGS: ENABLE_TESTABILITY=YES ENABLE_HARDENED_RUNTIME=NO CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH=${{ github.workspace }}/build/cas
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # Whether the change touches the app at all. The checkout is the pull request merged into its
      # base as the base is now: against that commit's first parent, that is the change. A change
      # that touches nothing the app is built or tested from stops here, as passed. supabase/ is
      # not such a place (the app's tests read server files), and web/content/changelog.json ships
      # inside the app.
      #
      # A push to dev: what the push changed, against the commit dev was at before it. A release
      # (dev into main): nothing to do, the commit already ran on dev.
      - name: What changed
        id: paths
        env:
          BEFORE: ${{ github.event.before }}
          RELEASE: ${{ github.event_name == 'pull_request' && github.head_ref == 'dev' && github.base_ref == 'main' }}
        run: |
          base=HEAD^1
          if [ "${{ github.event_name }}" = push ] && git fetch -q --no-tags --depth=1 origin "$BEFORE" 2>/dev/null; then base=$BEFORE; fi
          echo "BASE=$base" >> "$GITHUB_ENV"
          git diff --name-only "$base" HEAD > changed.txt
          echo "$(wc -l < changed.txt | tr -d ' ') files changed since $base"
          app=false
          if [ "$RELEASE" = true ]; then
            echo "a release: this commit already ran on dev"
            echo "app=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qvE '^(web/|docs/|strategy/|brand/|plugins/|cli/|scripts/|[^/]+\.md$|LICENSE$|\.github/)' changed.txt \
             || grep -qxE 'web/content/changelog\.json|\.github/workflows/ci\.yml' changed.txt; then app=true; fi
          echo "app tests: $app"
          echo "app=$app" >> "$GITHUB_OUTPUT"
      - name: Select the newest Xcode
        if: steps.paths.outputs.app == 'true'
        id: xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] && sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//')" >> "$GITHUB_OUTPUT"
      # The Swift packages and the compiler's own cache of what it has built (by content, so a
      # file that did not change is not compiled again), kept between runs of this job.
      - name: Packages and compiled output from earlier runs
        if: steps.paths.outputs.app == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            build/DD/SourcePackages
            build/cas
          key: app-unit-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Pane.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            app-unit-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Pane.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            app-unit-${{ steps.xcode.outputs.version }}-
      - name: Generate the project
        if: steps.paths.outputs.app == 'true'
        run: brew install xcodegen && xcodegen generate
      - name: Build the app and its tests
        if: steps.paths.outputs.app == 'true'
        run: |
          set -o pipefail
          mkdir -p build
          du -sh build/cas build/DD/SourcePackages 2>/dev/null || echo "nothing from earlier runs"
          xcodebuild build-for-testing -project Pane.xcodeproj -scheme Pane -destination 'platform=macOS' \
            -derivedDataPath build/ci -clonedSourcePackagesDirPath build/DD/SourcePackages $XC_FLAGS \
            | tee build/ci-build.log | grep -E "error:|\*\* TEST BUILD" || true
          grep -q "\*\* TEST BUILD SUCCEEDED \*\*" build/ci-build.log
      - name: The tests this change is likely to break
        if: steps.paths.outputs.app == 'true'
        env:
          TEST_RUNNER_PANE_PERF_SLACK: "4"
          TEST_RUNNER_PANE_SNAPSHOTS: "1"
        run: |
          set -o pipefail
          # A pull request: against the first parent of the merged checkout, its change and no one
          # else's. A push: against where dev was before it (BASE, from "What changed").
          git diff --name-only "$BASE" HEAD > changed.txt
          python3 scripts/ci/select-tests.py changed.txt > only.txt
          xcodebuild test-without-building -project Pane.xcodeproj -scheme Pane -destination 'platform=macOS' \
            $(tr '\n' ' ' < only.txt) -derivedDataPath build/ci -resultBundlePath build/ci-tests.xcresult $XC_FLAGS \
            | scripts/ci/show-tests.sh build/ci-test.log
          # A name that matches no test is not an error to xcodebuild, so count: every single test
          # that was asked for has to have run.
          # The number comes from the result bundle, not from the log: the test host writes into
          # the same stream and can cut the "Test run with N tests" line in two (#488).
          asked=$(grep -c '()$' only.txt || true)
          ran=$(xcrun xcresulttool get test-results summary --path build/ci-tests.xcresult --compact \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["totalTestCount"])')
          echo "$ran tests ran, $asked single tests were asked for"
          if [ "$ran" -lt "$asked" ]; then
            echo "error: $asked single tests were asked for and $ran ran; a line in scripts/ci/smoke-tests.txt matches no test"
            exit 1
          fi
      # A push to dev keeps what it compiled for the pull requests after it.
      - name: Keep the packages and compiled output
        if: github.event_name == 'push' && steps.paths.outputs.app == 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: |
            build/DD/SourcePackages
            build/cas
          key: app-unit-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Pane.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-results
          path: |
            build/ci-build.log
            build/ci-test.log
            build/ci-tests.xcresult
            ~/Library/Logs/DiagnosticReports/Pane*
          retention-days: 7

  # Every night on dev, and by hand: every app test, in one job that reports and never blocks. The
  # unit and interaction tests first, then the suites that time things or count what is worked out
  # again, in a process of their own, one test at a time. What failed and every PERF line go to the
  # job's summary.
  app-unit:
    name: Nightly, every app test (macOS, reports only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # The suites that time things or count bodies (PaneTests/Perf), run after the others.
      PERF_ONLY: -only-testing:PaneTests/EditorPerfTests -only-testing:PaneTests/AppPerfTests -only-testing:PaneTests/ScanPerfTests -only-testing:PaneTests/WindowUpdateTests -only-testing:PaneTests/NoteOpenTests -only-testing:PaneTests/ListPiecesPerfTests
      PERF_SKIP: -skip-testing:PaneTests/EditorPerfTests -skip-testing:PaneTests/AppPerfTests -skip-testing:PaneTests/ScanPerfTests -skip-testing:PaneTests/WindowUpdateTests -skip-testing:PaneTests/NoteOpenTests -skip-testing:PaneTests/ListPiecesPerfTests
      XC_FLAGS: ENABLE_TESTABILITY=YES ENABLE_HARDENED_RUNTIME=NO CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH=${{ github.workspace }}/build/cas
    steps:
      # The schedule runs on the default branch (main): the nightly tests dev, where the work is.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}
      - name: Select the newest Xcode
        id: xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] && sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//')" >> "$GITHUB_OUTPUT"
      # The Swift packages and the compiler's own cache of what it has built (by content, so a
      # file that did not change is not compiled again), kept between runs of this job.
      - name: Packages and compiled output from earlier runs
        uses: actions/cache@v4
        with:
          path: |
            build/DD/SourcePackages
            build/cas
          key: app-unit-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Pane.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            app-unit-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Pane.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            app-unit-${{ steps.xcode.outputs.version }}-
      - name: Generate the project
        run: brew install xcodegen && xcodegen generate
      - name: Build the app and its tests
        run: |
          set -o pipefail
          mkdir -p build
          du -sh build/cas build/DD/SourcePackages 2>/dev/null || echo "nothing from earlier runs"
          xcodebuild build-for-testing -project Pane.xcodeproj -scheme Pane -destination 'platform=macOS' \
            -derivedDataPath build/ci -clonedSourcePackagesDirPath build/DD/SourcePackages $XC_FLAGS \
            | tee build/ci-build.log | grep -E "error:|\*\* TEST BUILD" || true
          grep -q "\*\* TEST BUILD SUCCEEDED \*\*" build/ci-build.log
      - name: Unit and interaction tests
        id: unit
        continue-on-error: true
        env:
          # Runners are several times slower than a developer's Mac; see PaneTests/Perf/PerfBudget.swift.
          TEST_RUNNER_PANE_PERF_SLACK: "4"
          # Snapshot tests that draw windows (ImageViewerSnapshots) run here only, never on a developer's Mac.
          TEST_RUNNER_PANE_SNAPSHOTS: "1"
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Pane.xcodeproj -scheme Pane -destination 'platform=macOS' \
            -only-testing:PaneTests $PERF_SKIP -derivedDataPath build/ci -resultBundlePath build/ci-tests.xcresult $XC_FLAGS \
            | scripts/ci/show-tests.sh build/ci-test.log
          # test-without-building says TEST EXECUTE SUCCEEDED.
      - name: Timing and render-count tests
        id: timing
        continue-on-error: true
        env:
          # Runners are several times slower than a developer's Mac; see PaneTests/Perf/PerfBudget.swift.
          TEST_RUNNER_PANE_PERF_SLACK: "4"
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Pane.xcodeproj -scheme Pane -destination 'platform=macOS' \
            $PERF_ONLY -parallel-testing-enabled NO -derivedDataPath build/ci -resultBundlePath build/ci-perf.xcresult $XC_FLAGS \
            | scripts/ci/show-tests.sh build/ci-perf.log
      - name: What the tests said
        if: always()
        run: |
          {
            echo "### Unit and interaction tests: ${{ steps.unit.outcome }}"
            [ -f build/ci-test.log ] && grep -E '^✘ ' build/ci-test.log | grep -vE '^✘ (Suite|Test run) ' | cut -c1-400 | sed 's/^/- /' || true
            echo
            echo "### Timing and render-count tests: ${{ steps.timing.outcome }}"
            [ -f build/ci-perf.log ] && grep -E '^✘ ' build/ci-perf.log | grep -vE '^✘ (Suite|Test run) ' | cut -c1-400 | sed 's/^/- /' || true
            echo
            echo '```'
            [ -f build/ci-perf.log ] && grep -E 'PERF' build/ci-perf.log | grep -vE '^[0-9]{4}-' | cut -c1-300 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # A failure keeps the whole log and the result bundle: a test host that hangs or crashes
      # records no issue in the filtered output above, only its name under "Failing tests". The
      # crash reports say where it died.
      # The job shows red when a test failed, so it is seen; the run stays green (continue-on-error above).
      - name: Mark the job red when a test failed
        if: steps.unit.outcome == 'failure' || steps.timing.outcome == 'failure'
        run: exit 1
      - name: Keep the test results
        if: always() && (steps.unit.outcome == 'failure' || steps.timing.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: app-test-results
          path: |
            build/ci-build.log
            build/ci-test.log
            build/ci-tests.xcresult
            build/ci-perf.log
            build/ci-perf.xcresult
            ~/Library/Logs/DiagnosticReports/Pane*
          retention-days: 7
      # Pictures the snapshot tests attach (FileViewerSnapshots and others): kept after every run, so a
      # UI change can be looked at without running anything on a developer's screen.
      - name: Export the snapshots
        if: always()
        run: |
          mkdir -p build/snapshots
          [ -d build/ci-tests.xcresult ] && xcrun xcresulttool export attachments --path build/ci-tests.xcresult --output-path build/snapshots || true
      - name: Keep the snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: build/snapshots
          if-no-files-found: ignore
          retention-days: 7

  server:
    name: Server (Deno)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck the Edge Functions
        run: for f in supabase/functions/*/index.ts scripts/e2ee-tool.ts scripts/e2ee-wipe-storage.ts; do deno check "$f"; done
      # Side by side, except the files that write the environment: see the script.
      - name: Unit tests
        run: >-
          scripts/ci/deno-tests.sh
          supabase/functions/_shared/e2ee.test.ts supabase/functions/_shared/log.test.ts supabase/functions/_shared/apns.test.ts supabase/functions/_shared/db.test.ts supabase/functions/_shared/client.test.ts supabase/functions/_shared/region.test.ts
          supabase/functions/mcp/notes.test.ts supabase/functions/mcp/needs_database.test.ts supabase/functions/mcp/annotations.test.ts supabase/functions/mcp/card.test.ts supabase/functions/mcp/instructions.test.ts
          supabase/functions/mcp/oauth.pglite.test.ts supabase/functions/mcp/locked.pglite.test.ts supabase/functions/mcp/e2ee.pglite.test.ts
          supabase/functions/mcp/canary.pglite.test.ts supabase/functions/mcp/sealed_tools.pglite.test.ts supabase/functions/mcp/device_add.pglite.test.ts
          supabase/functions/mcp/tips.pglite.test.ts supabase/functions/mcp/folder_files.pglite.test.ts supabase/functions/mcp/share_ask.pglite.test.ts supabase/functions/mcp/open_source_ask.pglite.test.ts supabase/functions/mcp/download_counts.pglite.test.ts supabase/functions/mcp/collab.pglite.test.ts
          supabase/functions/share-files/logic.test.ts scripts/e2ee-tool.test.ts
          supabase/functions/account/account.pglite.test.ts supabase/functions/account/sign_up_pause.pglite.test.ts supabase/functions/_shared/hash.test.ts
          scripts/auth-emails.test.ts scripts/ops/daily-digest.test.ts supabase/functions/mcp/tool_errors.test.ts supabase/functions/lifecycle/logic.test.ts supabase/functions/lifecycle/emails.test.ts supabase/functions/lifecycle/assets.test.ts supabase/functions/lifecycle/lifecycle.pglite.test.ts
          supabase/functions/mcp/rename.pglite.test.ts supabase/functions/mcp/files_tools.pglite.test.ts supabase/functions/mcp/files_production.pglite.test.ts supabase/functions/mcp/site_tools.test.ts
          supabase/functions/_shared/keycopy.test.ts supabase/functions/key/key.pglite.test.ts supabase/functions/key/notice.test.ts

  # Only for a pull request into main (a required check there): the site deploys on its own.
  web:
    name: Share site
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
