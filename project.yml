name: PintoNotes
options:
  bundleIdPrefix: dev.emilwagman
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.31.0
  Markdown:
    url: https://github.com/swiftlang/swift-markdown
    from: 0.6.0
  # Collaboration prototype: the text CRDT behind shared notes (docs/Technical/collaboration-design.md).
  Automerge:
    # 0.7.2 with a public Cursor initializer (Vendor/README.md).
    path: Vendor/automerge-swift
  # Updates for the Mac download only (target PintoNotesDirect); App Store builds never link it.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
# Who the app is (bundle id, name, URL scheme, app group) and how it signs: Config/Identity.xcconfig,
# which Config/Identity.local.xcconfig overrides (scripts/make-it-yours.sh writes it).
configFiles:
  Debug: Config/Identity.xcconfig
  Release: Config/Identity.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  PintoNotes:
    # Source names change; install and update product names stay fixed.
    productName: Pane
    type: application
    supportedDestinations: [iOS, macOS]
    # PintoNotes/Resources/Onboarding.xcassets (the sign-in and first-run pictures) comes in with the
    # folder, for the Mac and iPhone apps; the share extension lists its own sources and never it.
    sources: &appSources
      - PintoNotes
    configFiles:
      Debug: Config/Backend.xcconfig
      Release: Config/Backend.xcconfig
    dependencies:
      - package: Markdown
      - package: Supabase
      - package: ZIPFoundation
      - target: PintoNotesShare
        platformFilter: iOS
    # SwiftPM resource bundles (ZIPFoundation's and swift-crypto's privacy manifests, and any
    # added later) arrive in Contents/Resources signed with the archive's Apple Development
    # identity. The App Store export re-signs only the app and its nested code, so Apple
    # rejected those bundles (ITMS-90284). Without their own signature they're plain resources,
    # sealed by the app's signature, which the export does re-sign. Bundles with an executable
    # keep theirs. The bundles' names aren't known ahead, so the script can't declare them as
    # outputs; the target turns off user script sandboxing (this is its only script).
    postBuildScripts:
      - name: Unsign resource bundles
        basedOnDependencyAnalysis: false
        script: |
          [ "$PLATFORM_NAME" = macosx ] || exit 0
          cd "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" || exit 0
          for b in *.bundle; do
            [ -d "$b/Contents/_CodeSignature" ] || continue
            /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$b/Contents/Info.plist" >/dev/null 2>&1 && continue
            rm -rf "$b/Contents/_CodeSignature"
            echo "Unsigned $b"
          done
    info:
      path: PintoNotes/Resources/Info.plist
      properties: &appInfo
        CFBundleDisplayName: $(PANE_DISPLAY_NAME)
        CFBundleName: $(PANE_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleURLTypes:
          - CFBundleURLName: dev.emilwagman.pane.connect
            CFBundleURLSchemes: [$(PANE_URL_SCHEME)]
        # Handoff: Connect ChatGPT or Claude, started on iPhone, continues on the Mac.
        NSUserActivityTypes: [dev.emilwagman.pane.connect]
        # Connect an AI: whether the ChatGPT and Claude apps are on this iPhone (canOpenURL; no dialog).
        LSApplicationQueriesSchemes: [chatgpt, claude]
        PaneSupabaseURL: $(PANE_SUPABASE_URL)
        PaneSupabaseKey: $(PANE_SUPABASE_KEY)
        PaneShareURL: $(PANE_SHARE_URL)
        PaneMCPURL: $(PANE_MCP_URL)
        PaneAuthHost: $(PANE_AUTH_HOST)
        PaneURLScheme: $(PANE_URL_SCHEME)
        PaneBundleID: $(PANE_BUNDLE_ID)
        PaneAppGroup: $(PANE_APP_GROUP)
        # A build's own accent (scripts/set-accent.sh); empty is amber (Palette.accent).
        PaneAccent: $(PANE_ACCENT)
        PanePostHogKey: $(PANE_POSTHOG_KEY)
        PanePostHogHost: $(PANE_POSTHOG_HOST)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSAppleEventsUsageDescription: Pinto Notes reads the Apple Notes you choose to import. It never changes them.
        NSFaceIDUsageDescription: Pinto Notes uses Face ID to open your locked notes, show your recovery key, approve AI connections and add a device.
        NSCameraUsageDescription: Pinto Notes uses the camera to scan the code on a device you add.
        NSPhotoLibraryAddUsageDescription: Pinto Notes saves a picture to your photo library when you choose Save Image in the share sheet.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.emilwagman.pane.item
            UTTypeDescription: Pinto Notes item
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: {}
        # Evernote exports (.enex), which Evernote doesn't declare. Opening one (Files, Finder,
        # the share sheet) starts the Evernote import.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.evernote.enex
            UTTypeDescription: Evernote export
            UTTypeConformsTo: [public.xml, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [enex]
              public.mime-type: [application/enex+xml]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Evernote export
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.evernote.enex]
        # Opened in place: the import copies the file before reading it.
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base: &appSettings
        PRODUCT_BUNDLE_IDENTIFIER: $(PANE_BUNDLE_ID)
        # Config/Identity.xcconfig's signing: without this the iOS preset XcodeGen gives a two-platform
        # target ("iPhone Developer") would win on the Mac too, and a plain build there would ask for a team.
        CODE_SIGN_IDENTITY: $(inherited)
        # The app's file name. Dev and test builds are Pane.app; scripts/testflight.sh sets
        # PANE_PRODUCT_NAME="Pinto Notes" so the shipped Mac app installs as Pinto Notes.app.
        PANE_PRODUCT_NAME: Pane
        PRODUCT_NAME: $(PANE_PRODUCT_NAME)
        PRODUCT_MODULE_NAME: PintoNotes
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # AccentColor, or the gitignored AccentColorLocal scripts/set-accent.sh writes.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: $(PANE_ACCENT_ASSET)
        ENABLE_HARDENED_RUNTIME: YES
        # Ad-hoc builds use PintoNotes-mac.entitlements; scripts/install-mac.sh passes
        # PANE_MAC_ENTITLEMENTS=PintoNotes-mac-signed.entitlements for the team-signed app, and
        # scripts/testflight.sh passes PintoNotes-mac-appstore.entitlements (sandboxed) for TestFlight.
        PANE_MAC_ENTITLEMENTS: PintoNotes-mac.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": PintoNotes/Resources/$(PANE_MAC_ENTITLEMENTS)
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": PintoNotes/Resources/$(PANE_IOS_ENTITLEMENTS)
  # The Mac download (Developer ID, notarized, a DMG): the same app plus Sparkle for updates.
  # Built only by scripts/release-mac.sh; the App Store/TestFlight build is the PintoNotes target.
  PintoNotesDirect:
    productName: Pinto Notes
    type: application
    platform: macOS
    sources: *appSources
    configFiles:
      Debug: Config/Backend.xcconfig
      Release: Config/Backend.xcconfig
    dependencies:
      - package: Markdown
      - package: Supabase
      - package: ZIPFoundation
      - package: Sparkle
    info:
      path: PintoNotes/Resources/Info-Direct.plist
      properties:
        <<: *appInfo
        SUFeedURL: $(PANE_UPDATE_FEED)
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        # Updates come on their own: a check every hour (Sparkle's shortest), downloaded quietly and
        # installed when the app quits. Setting SUEnableAutomaticChecks here also skips Sparkle's
        # "check automatically?" question. Updater.swift has the rest.
        SUEnableAutomaticChecks: true
        SUAllowsAutomaticUpdates: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 3600
    settings:
      base:
        <<: *appSettings
        PANE_PRODUCT_NAME: Pinto Notes
        PANE_MAC_ENTITLEMENTS: PintoNotes-mac-direct.entitlements
        # SPARKLE: updates; DIRECT: Sign in with Apple through the web (no entitlement in Developer ID).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SPARKLE DIRECT
        # Sparkle's EdDSA public key; the private half is in the login Keychain (and .secrets/).
        SPARKLE_PUBLIC_KEY: teSFUYF3dK744mGRKD/3wqWEt7hBH4+J5DINTeFq5r4=
  PintoNotesShare:
    productName: PaneShare
    type: app-extension
    platform: iOS
    sources:
      - PintoNotesShare
      - PintoNotes/Views/AppMark.swift
      - PintoNotes/Model/Inbox.swift
      - PintoNotes/Model/AppIdentity.swift
      - PintoNotes/Model/SharedItem.swift
      - PintoNotes/Model/RichTextToMarkdown.swift
      - PintoNotes/Model/OfflineHTML.swift
      - PintoNotes/Editor/Platform.swift
      - PintoNotes/Editor/Palette.swift
      - PintoNotes/Editor/Theme.swift
      - path: PintoNotes/Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: PintoNotesShare/Info.plist
      properties:
        CFBundleDisplayName: $(PANE_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        PaneAppGroup: $(PANE_APP_GROUP)
        PaneAccent: $(PANE_ACCENT)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 10
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PANE_BUNDLE_ID).share
        # Keep the installed extension bundle and executable names.
        PRODUCT_NAME: PaneShare
        PRODUCT_MODULE_NAME: PintoNotesShare
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: PintoNotesShare/PintoNotesShare.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SKIP_INSTALL: YES
  PintoNotesTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: PintoNotesTests
        excludes: [Fixtures]
      - path: PintoNotesTests/Fixtures
        excludes: [Markdown, Keep]
        buildPhase: resources
      # Export trees from Obsidian, Notion, Bear, Joplin, Logseq, Simplenote and Standard Notes,
      # copied whole so their folders (and hidden ones) stay as the apps write them.
      - path: PintoNotesTests/Fixtures/Markdown
        type: folder
        buildPhase: resources
      # A Google Takeout download with its Keep folder, as Google writes it.
      - path: PintoNotesTests/Fixtures/Keep
        type: folder
        buildPhase: resources
      # Server files the tests check against, copied into the bundle when it's built (the test
      # host can't read the checkout under ~/Documents without a privacy prompt).
      - path: supabase/functions/_shared/e2ee-vectors.json
        buildPhase: resources
      - path: supabase/functions/_shared/collab-vectors.json
        buildPhase: resources
      - path: supabase/functions/_shared/keycopy-vectors.json
        buildPhase: resources
      - path: supabase/migrations/20260929230000_tip_events.sql
        buildPhase: resources
      - path: supabase/migrations/20261012120000_feature_use_new_app.sql
        buildPhase: resources
      # The page that lists what the app reports, checked against the code (TelemetryTests).
      - path: docs/Technical/app-telemetry.md
        buildPhase: resources
      # More of the checkout the tests read, for the same reason (TestFiles.swift): the demo note
      # apps (NotePageTests), the AI server's stylesheet and file kinds, and the app's own views
      # (PintoButtonTests reads which button style each uses).
      - path: demo/note-pages
        type: folder
        buildPhase: resources
      - path: PintoNotes/Resources/AppLibraries/amber-base.css
        buildPhase: resources
      - path: supabase/functions/mcp/pinto-base.ts
        buildPhase: resources
      - path: supabase/functions/mcp/folder_files.ts
        buildPhase: resources
      # The Mac download's Info.plist, for its update settings (UpdaterTests).
      - path: PintoNotes/Resources/Info-Direct.plist
        buildPhase: resources
      - path: PintoNotes/Views
        type: folder
        buildPhase: resources
      # The rest of the app's code, for OldNameTests (no string says the old name).
      - path: PintoNotes/App
        type: folder
        buildPhase: resources
      - path: PintoNotes/Model
        type: folder
        buildPhase: resources
      - path: PintoNotes/Editor
        type: folder
        buildPhase: resources
      - path: PintoNotes/Sync
        type: folder
        buildPhase: resources
      - path: PintoNotes/Telemetry
        type: folder
        buildPhase: resources
      - path: PintoNotesShare
        type: folder
        buildPhase: resources
      # The project, for OnboardingArtTests (the pictures stay out of the share extension).
      - path: project.yml
        buildPhase: resources
      # Who the app is and how it signs, for FreshCloneTests (a clone with no Apple team builds).
      - path: Config/Identity.xcconfig
        buildPhase: resources
      - path: PintoNotes/Resources/PintoNotes-ios-personal.entitlements
        buildPhase: resources
      # The design rules, for PintoButtonTests (the button sizes and radii in code are the file's).
      - path: docs/DESIGN.md
        buildPhase: resources
      # Collaboration's Automerge parts, built here against the real Automerge: the app doesn't
      # link it (see PintoNotes/Collab/CollabText.swift).
      - path: PintoNotes/Collab/CollabText.swift
    dependencies:
      - target: PintoNotes
      - package: Automerge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.emilwagman.PaneTests
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) COLLAB_AUTOMERGE
        GENERATE_INFOPLIST_FILE: YES
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Pane.app/Contents/MacOS/Pane"
  PintoNotesUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources: [PintoNotesUITests]
    dependencies:
      - target: PintoNotes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.emilwagman.PaneUITests
        TEST_TARGET_NAME: PintoNotes
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
schemes:
  PintoNotesDirect:
    build:
      targets:
        PintoNotesDirect: all
    archive:
      config: Release
  PintoNotes:
    build:
      targets:
        PintoNotes: all
    test:
      targets: [PintoNotesTests, PintoNotesUITests]
